
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-waste-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: food-waste-portal
  template:
    metadata:
      labels:
        app: food-waste-portal
    spec:
      containers:
        - name: food-waste-portal
          image: raghuldev7/food-waste-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: food-waste-portal-service
spec:
  type: NodePort
  selector:
    app: food-waste-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30014
